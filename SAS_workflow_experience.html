function message(who,html){return `<div class="message"><div class="avatar ${who==='你'?'user':''}">${who==='你'?'你':'✳'}</div><div class="bubble"><h3>${who}</h3>${html}</div></div>`}
function inputTransferView(){
 return '<div class="app-toolbar"><span aria-hidden="true">←　↑</span><div class="address-field">本機　›　下載 → SAS Agent / Input</div></div><div class="transfer-view"><div class="transfer-panels"><section class="transfer-folder" aria-label="下載資料夾"><div class="transfer-path">▰　下載（Downloads）</div><div class="transfer-tools">'+btn('剪下','cut-xml',false,!s.selected||s.moved)+'</div><div class="transfer-files">'+(s.moved?'<p class="folder-empty">此資料夾是空的。</p>':'<button class="transfer-file '+(s.cut?'is-cut':'')+'" id="download-xml" data-action="select-download" draggable="true" aria-pressed="'+s.selected+'"><span class="file-icon">XML</span><span><strong>11507_demo.xml</strong><small>XML 文件 · 已下載</small></span></button>')+'</div><div class="transfer-count">'+(s.moved?'0':'1')+' 個項目</div></section><div class="transfer-arrow" aria-hidden="true">→</div><section class="transfer-folder '+(s.moved?'transfer-complete':'')+'" id="input-drop" aria-label="Input 目的資料夾"><div class="transfer-path">▰　SAS Agent　›　Input</div><div class="transfer-tools">'+btn('貼上','paste-xml',false,!s.cut||s.moved)+'</div><div class="transfer-files">'+(s.moved?'<div class="transfer-file received"><span class="file-icon">XML</span><span><strong>11507_demo.xml</strong><small>已移入 Input</small></span><span class="transfer-tick">✓</span></div>':'<div class="folder-drop"><span aria-hidden="true">▰</span><p>將 XML 拖曳到這裡</p><small>或選取檔案 → 剪下 → 貼上</small></div>')+'</div><div class="transfer-count">'+(s.moved?'1':'0')+' 個項目</div></section></div><div class="transfer-bottom"><p role="status">'+(s.moved?'✓ 11507_demo.xml 已移入 SAS Agent/Input。':'從下載資料夾移入本月 XML。')+'</p>'+btn('回到 OpenClaw，執行 Skill →','place-xml',true,!s.moved)+'</div></div>';
}
// Only the in-page demo file can be moved; external files are never read.
document.addEventListener('dragstart',e=>{
 if(e.target.id!=='download-xml'||s.moved)return;
 e.dataTransfer.setData('application/x-sas-demo','11507_demo.xml');e.dataTransfer.effectAllowed='move';
});
document.addEventListener('dragover',e=>{
 const target=e.target.closest('#input-drop');
 if(!target||mode!=='skill'||s.step!==0||s.moved||!Array.from(e.dataTransfer.types).includes('application/x-sas-demo'))return;
 e.preventDefault();e.dataTransfer.dropEffect='move';target.classList.add('drag-over');
});
document.addEventListener('dragleave',e=>{const target=e.target.closest('#input-drop');if(target&&!target.contains(e.relatedTarget))target.classList.remove('drag-over')});
document.addEventListener('dragend',()=>$('#input-drop')?.classList.remove('drag-over'));
document.addEventListener('drop',e=>{
 const target=e.target.closest('#input-drop');if(!target)return;
 e.preventDefault();target.classList.remove('drag-over');
 if(mode!=='skill'||s.step!==0||s.moved||e.dataTransfer.getData('application/x-sas-demo')!=='11507_demo.xml')return;
 s.moved=true;s.selected=false;s.cut=false;s.actions++;render();$('[data-action="place-xml"]').focus();
});
function updateSkillComposer(){
 const input=$('#command');if(!input)return;
 if(input.value!==s.command)input.value=s.command;
 const query=s.command.trim().toLowerCase();
 const suggest=!s.skillChosen&&query.startsWith('/sas')&&'/sas-for-eden'.startsWith(query);
 $('#skill-suggestions').hidden=!suggest;$('#chosen-skill').hidden=!s.skillChosen;
 input.placeholder=s.skillChosen?'輸入：執行':'輸入 /sas 選擇 Skill';
 input.setAttribute('aria-expanded',String(suggest));input.removeAttribute('aria-activedescendant');
 $('#sas-option').setAttribute('aria-selected','false');
 $('#run-form button[type="submit"]').disabled=!(s.skillChosen&&query==='執行');
 $('#command-error').textContent='';
}
function selectSasSkill(){s.skillChosen=true;s.command='';updateSkillComposer();$('#command').focus()}
document.addEventListener('keydown',e=>{
 if(e.target.id!=='command'||e.isComposing)return;
 const list=$('#skill-suggestions');if(list.hidden)return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();e.target.setAttribute('aria-activedescendant','sas-option');$('#sas-option').setAttribute('aria-selected','true')}
 if(e.key==='Enter'){e.preventDefault();selectSasSkill()}
 if(e.key==='Escape'){e.preventDefault();list.hidden=true;e.target.setAttribute('aria-expanded','false');e.target.removeAttribute('aria-activedescendant')}
});
function parseNewUnitReply(reply){
 const text=reply.normalize('NFKC').trim().replace(/[\s，,。.!！:：、]/g,'');
 if(/^(全部加入|(?:編號)?1(?:號)?加入|加入(?:編號)?1(?:號)?)$/.test(text))return 'add';
 if(/^(全部忽略|(?:編號)?1(?:號)?忽略|忽略(?:編號)?1(?:號)?)$/.test(text))return 'ignore';
 return null;
}
function escapeChatText(text){return text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function skillView(){if(s.step===0)return inputTransferView();let content='';
switch(s.step){
case 1:content=message('SAS Agent',`<p>XML 已就緒。請選擇 Skill，再輸入「執行」。</p>${file('11507_demo.xml','SAS Agent / Input / 11507_demo.xml')}<div class="skill-command"><div class="skill-suggestions" id="skill-suggestions" role="listbox" aria-label="Skill 建議" hidden><span class="skill-suggestion-label">SKILLS</span><button type="button" role="option" id="sas-option" aria-selected="false" data-action="select-sas"><strong>/sas-for-eden</strong><small>SAS 輪派報表</small></button></div><form class="chat-input" id="run-form"><div class="chosen-skill" id="chosen-skill" hidden><span>/sas-for-eden</span><button type="button" data-action="clear-sas" aria-label="移除所選 Skill">×</button></div><input id="command" aria-label="執行指令" role="combobox" aria-autocomplete="list" aria-controls="skill-suggestions" aria-expanded="false" autocomplete="off" placeholder="輸入 /sas 選擇 Skill"><button class="primary" type="submit" disabled>送出 ↑</button></form><div id="command-error" class="error" role="status"></div></div>`);break;
case 2:content=message('你','<p>/sas-for-eden 執行</p>')+message('SAS Agent',`<details class="log-details"><summary>查看處理紀錄</summary><div class="log">✓ 檢查唯一 XML 與欄位<br>✓ 以本機腳本完成去識別化 Excel<br>✓ 比對日常 B 單位名冊<br>⏸ 報表暫停，等待新單位決策</div></details><div class="task-card"><span class="badge warn">發現 1 個新單位</span><div class="decision"><ol class="new-unit-list"><li><h3>新芽居家長照機構</h3><p class="small muted">分類：居服 · BA01 / BA02</p></li></ol></div><p id="unit-reply-hint">請用編號告訴我哪些要「加入」、哪些要「忽略」，或回覆「全部加入／全部忽略」。</p></div><form class="chat-input" id="unit-reply-form"><input id="unit-reply" aria-label="新單位處理回覆" aria-describedby="unit-reply-hint" placeholder="例如：1 加入，或全部忽略" autocomplete="off"><button class="primary" type="submit">送出 ↑</button></form><div id="unit-reply-error" class="error" role="status"></div>`);break;
case 3:content=message('你',`<p>${escapeChatText(s.unitReply)}</p>`)+message('SAS Agent',`<details class="log-details"><summary>查看處理紀錄</summary><div class="log">✓ ${s.choice==='add'?'更新名冊與分類內序號公式':'新單位未寫入名冊'}<br>✓ 依 CASENO 去重，計算派案／接案<br>✓ 繼承範本底色、框線、總計及列印設定（模擬）</div></details>${file('11507_輪派報表.xlsx',s.reviewed?'Output / 等待確認歸檔':'Output / 等待人工檢核','review','開啟 Excel 預覽')}<div class="notice"><strong>尚未歸檔。</strong> Excel 檢核後，請輸入「確認無誤，歸檔」。</div><form class="chat-input" id="finalize-form"><input id="confirmation" aria-label="歸檔確認文字" placeholder="請輸入：確認無誤，歸檔" autocomplete="off" ${s.reviewed?'':'disabled'}><button class="primary" type="submit" ${s.reviewed?'':'disabled'}>送出 ↑</button></form><div id="error" class="error" role="status"></div>`);break;
case 4:content=message('你','<p>確認無誤，歸檔。</p>')+message('SAS Agent',`<details class="log-details"><summary>查看處理紀錄</summary><div class="log">✓ 名冊與報表一致性驗證通過<br>✓ 已同步工作區範本<br>✓ XML 與輪派報表已歸檔（模擬）</div></details><div class="success-mark">✓</div><h2>本月作業完成</h2><p>Skill 完成處理；<strong>決策、檢核與授權，仍由你掌握。</strong></p><div class="tree">Archive/11507/
  11507_demo.xml
  11507_輪派報表.xlsx

Excel_validation/
  11507raw_data_de_identification.xlsx</div><p class="hint-line">名冊與範本保留，供下月使用。</p>${btn('回到 Original Workflow','switch-original',false)}`);break;}
return `<div class="chat-layout"><div class="chat">${content}</div>${![1,2,3].includes(s.step)?`<div class="claw-composer-idle"><span>${s.step===4?'本月作業已完成':'依上方操作繼續此任務'}</span><small>sas-for-eden</small></div>`:''}<details class="workspace-details"><summary>工作區檔案</summary><div class="context"><div class="context-item mono">SAS Agent/<span>工作區已備妥</span></div>${[['Input/',s.step<1?'等待 XML':s.step===4?'已歸檔，資料夾淨空':'11507_demo.xml'],['Excel_validation/',s.step<2?'等待執行':'去識別化 Excel 已產生'],['Output/',s.step<3?'尚無輪派報表':s.step===4?'已歸檔，資料夾淨空':'輪派報表待確認'],['Archive/11507/',s.step===4?'XML ＋ 輪派報表':'等待明確確認'],['B_unit_roster/',`日常名冊 · ${s.step>=3&&s.choice==='add'?'4':'3'} 個 Y 單位`]].map(([a,b])=>`<div class="context-item mono">${a}<span>${b}</span></div>`).join('')}</div></details></div>`;
}
function setMode(next){closeReview(false);mode=next;render()}
function openReview(){lastFocus=document.activeElement;$('#review').innerHTML=`<div class="review-modal"><div class="review-toolbar"><strong id="review-title">Microsoft Excel · 人工檢核模擬</strong><button data-action="close-review" aria-label="關閉預覽">✕</button></div>${excelChrome('輪派報表')}<div class="modal-content">${report(s.choice==='add')}<div class="notice">目前新單位選擇：${s.choice==='add'?'加入，BA 合計為 26/20':'忽略，BA 合計為 14/11'}。正式作業須以 Microsoft Excel 檢核。</div>${checks()}${btn('檢核完成，返回 OpenClaw','review-done')}<div id="review-error" class="error" role="status"></div></div></div>`;$('#review').hidden=false;$('main').inert=true;$('header').inert=true;$('#review button').focus()}
function closeReview(restore=true){$('#review').hidden=true;$('main').inert=false;$('header').inert=false;if(restore&&lastFocus?.isConnected)lastFocus.focus()}
function allChecked(root){return [...root.querySelectorAll('.review-check')].every(x=>x.checked)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mode){setMode(b.dataset.mode);return}const a=b.dataset.action;if(!a)return;(mode==='original'?m:s).actions++;
switch(a){
case'login':m.step=1;break;
case'query':m.queried=true;break;
case'export':m.step=2;break;
case'to-excel':m.step=3;break;
case'select-xml':m.imported=true;break;
case'cancel-import':m.imported=false;break;
case'import':if(m.xmlMode!=='table'){$('#error').textContent='請選擇「XML 表格」後按確定。';return}m.step=4;break;
case'save-raw':m.step=5;break;
case'create-pivot':if(m.fields.length!==4){$('#error').textContent='請勾選 PIB_UNIT、CASENO、SERVICE_CODE 與 ACCEPT。';return}m.step=6;break;
case'show-pivot':m.workbook='pivot';break;
case'show-report':m.workbook='report';break;
case'fill-report':{
 let invalid=false;
 groups.forEach((g,i)=>['assigned','accepted'].forEach((key,j)=>{const input=$('#'+key+'-'+i),value=m.values[i][j];const bad=value===''||Number(value)!==counts(i)[j];input.setAttribute('aria-invalid',String(bad));if(bad)invalid=true}));
 if(invalid){$('#error').textContent='數字尚未正確，請切回樞紐分析表，比對碼別及個案數。';return}
 if(m.seen.size<3){$('#error').textContent='請先查看 BA、BB、DA 三類碼別，再完成報表。';return}
 m.step=7;break;
}
case'save-report':if(!allChecked($('#stage'))){$('#error').textContent='請完成三項人工檢核後再儲存。';return}m.checked=true;m.step=8;break;
case'switch-skill':setMode('skill');return;case'switch-original':setMode('original');return;case'select-sas':selectSasSkill();return;case'clear-sas':s.skillChosen=false;s.command='';updateSkillComposer();$('#command').focus();return;case'select-download':s.selected=true;break;case'cut-xml':if(!s.selected||s.moved)return;s.cut=true;break;case'paste-xml':if(!s.cut||s.moved)return;s.moved=true;s.cut=false;break;case'place-xml':if(!s.moved)return;s.step=1;break;case'review':openReview();return;case'close-review':closeReview();return;case'review-done':if(!allChecked($('#review'))){$('#review-error').textContent='請完成三項人工檢核。';return}s.reviewed=true;closeReview(false);render();$('#confirmation').focus();$('#confirmation').scrollIntoView({block:'nearest'});return;default:return}render()});
document.addEventListener('input',e=>{
 if(e.target.id==='unit-reply'){s.unitReply=e.target.value;$('#unit-reply-error').textContent='';return}
 if(e.target.id==='command'){s.command=e.target.value;updateSkillComposer();return}
 if(e.target.dataset.reportGroup!==undefined){
  const g=Number(e.target.dataset.reportGroup),j=Number(e.target.dataset.reportKind);
  m.values[g][j]=e.target.value;
  // Refresh only totals so typing, focus and selection stay intact.
  const temp=document.createElement('div');temp.innerHTML=report(true,true);
  $('#stage .total').replaceWith(temp.querySelector('.total'));
 }
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.name==='xml-mode'){m.xmlMode=el.value;if($('#error'))$('#error').textContent=''}
 if(el.dataset.pivotField){m.fields=[...document.querySelectorAll('[data-pivot-field]:checked')].map(x=>x.dataset.pivotField)}
 if(el.id==='code-filter'||el.id==='accept-filter'){
  if(el.id==='code-filter'){m.filter=el.value;m.seen.add(m.filter)}else m.accept=el.value;
  render();$('#'+el.id).focus();
 }
 if(el.classList.contains('review-check')){const root=$('#review').hidden?$('#stage'):$('#review');if(allChecked(root)){const error=root.querySelector('.error');if(error)error.textContent=''}}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='run-form'){if(!s.skillChosen||$('#command').value.trim()!=='執行'){$('#command-error').textContent='請先選擇 /sas-for-eden，再輸入「執行」。';return}s.actions++;s.step=2;render()}else if(e.target.id==='unit-reply-form'){s.unitReply=$('#unit-reply').value;const choice=parseNewUnitReply(s.unitReply);if(!choice){$('#unit-reply-error').textContent='目前只有編號 1。請回覆「1 加入」、「1 忽略」、「全部加入」或「全部忽略」；同一單位只能選一種處理方式。';return}s.choice=choice;s.actions++;s.step=3;render()}else if(e.target.id==='finalize-form'){s.actions++;if(!s.reviewed){$('#error').textContent='請先完成 Excel 人工檢核。';return}if($('#confirmation').value.trim()!=='確認無誤，歸檔'){$('#error').textContent='請明確輸入「確認無誤，歸檔」。未確認前不會移動檔案。';return}s.step=4;render()}});
$('#reset').addEventListener('click',()=>{if(!confirm('要重新開始目前這一頁的體驗嗎？另一頁的進度會保留。'))return;closeReview(false);if(mode==='original')m=newManual();else s=newSkill();render()});
$('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('#fullscreen').textContent='請按 F11 全螢幕'}});
document.addEventListener('keydown',e=>{if(!$('#review').hidden){if(e.key==='Escape'){closeReview();return}if(e.key==='Tab'){const items=[...$('#review').querySelectorAll('button,input')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}else if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();setMode(mode==='original'?'skill':'original');$('#tab-'+mode).focus()}});
function alignGuide(){
 const heading=$('.page-heading');
 if(!heading)return;
 if(window.innerWidth<=1100){heading.style.removeProperty('--guide-title-width');return}
 const gap=parseFloat(getComputedStyle(heading).columnGap);
 const titleWidth=heading.firstElementChild.getBoundingClientRect().width;
 const offset=$('.tabs').getBoundingClientRect().left-heading.getBoundingClientRect().left-gap;
 heading.style.setProperty('--guide-title-width',Math.max(titleWidth,offset)+'px');
}
window.addEventListener('resize',alignGuide);
document.fonts.ready.then(alignGuide);
render();
</script>
</body>
</html>
